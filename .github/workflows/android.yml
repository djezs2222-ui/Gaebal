name: Android APK
on:
  push:
    branches: [main, 'codex/**']
    tags: ['player-v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Restore optional persistent test signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          fi
      - name: Build and verify
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk dist/TabletPlayer-0.1.1-arm64.apk
          cd dist && sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TabletPlayer-ARM64-APK
          path: dist/*
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: TabletPlayer-device-test
          path: |
            app/build/outputs/apk/debug/app-x86_64-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Verification-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
  device-smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TabletPlayer-device-test
          path: test-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual playback, gestures and resume
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Nexus 7
          ram-size: 2048M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r $(find test-apks -name app-x86_64-debug.apk)
            adb install -r $(find test-apks -name app-debug-androidTest.apk)
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell am instrument -w kr.personal.tabletplayer.test/kr.personal.tabletplayer.SmokeRunner | tee device-smoke.txt
            adb exec-out run-as kr.personal.tabletplayer cat files/smoke-zoom.png > device-zoom.png || true
            adb logcat -d -t 400 > device-logcat.txt
            grep -q 'PASS:' device-smoke.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Device-smoke-result
          path: |
            device-smoke.txt
            device-zoom.png
            device-logcat.txt
  release:
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/heads/codex/') || startsWith(github.ref, 'refs/tags/player-v'))
    needs: [apk, device-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TabletPlayer-ARM64-APK
          path: apk
      - name: Publish downloadable test APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: player-test-0.1.1-${{ github.run_number }}
        run: |
          gh release create "$RELEASE_TAG" apk/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Tablet Player 0.1.1 test ${{ github.run_number }}" --notes 'Personal test APK. Build, unit tests and emulator playback/gesture checks passed. Android content URI descriptor, offset and permission-error checks passed. Actual tablet, NAS, SD/USB and subtitle rendering remain unverified. CI signing differs from the local APK unless DEBUG_KEYSTORE_BASE64 is configured.' --prerelease

